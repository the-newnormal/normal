<!doctype html>
<html lang="en-SG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Normal admin</title>
  <meta name="theme-color" content="#faf9f7">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<div class="db-app" id="app">
  <aside class="db-side" id="side" hidden>
    <a class="db-brand" href="#/" aria-label="Normal admin home">
      <img src="/assets/wordmark.svg" alt="Normal" width="1538" height="369"><span>admin</span>
    </a>
    <form class="db-search" id="search-form" role="search">
      <input class="db-input" type="search" id="search-q" placeholder="Search everything  /" aria-label="Search everything" autocomplete="off">
    </form>
    <nav class="db-nav" id="tabs" aria-label="Main"></nav>
    <div class="db-user" id="who">
      <span class="db-avatar" id="who-initials" aria-hidden="true"></span>
      <a class="db-user__name" id="who-name" href="#/"></a>
      <span class="db-user__role" id="who-role"></span>
      <button class="db-link" type="button" id="sign-out">sign out</button>
    </div>
  </aside>

  <main class="db-main" id="main">

    <!-- signed out -->
    <section class="db-gate" id="login" data-view hidden>
      <div class="db-card">
        <span class="db-brand"><img src="/assets/wordmark.svg" alt="Normal" width="1538" height="369"><span>admin</span></span>
        <h1>Sign in</h1>
        <p>Normal's records: members, applications, what's on and accounts.</p>
        <form id="login-form" novalidate>
          <div class="db-field">
            <label class="db-label" for="login-name">Username</label>
            <input class="db-input" type="text" id="login-name" autocomplete="username" autocapitalize="none" spellcheck="false" required>
          </div>
          <div class="db-field">
            <label class="db-label" for="login-password">Password</label>
            <input class="db-input" type="password" id="login-password" autocomplete="current-password" required>
          </div>
          <p class="db-error" id="login-error" role="alert"></p>
          <button class="db-btn db-btn--primary" type="submit" id="login-go">Sign in</button>
        </form>
        <p class="db-fine">No login yet, or forgot your password? Ask a Master Admin for a setup link.</p>
      </div>
    </section>

    <p class="db-alert" id="error" role="alert"></p>

    <!-- home -->
    <section id="home" data-view hidden>
      <header class="db-head">
        <div>
          <p class="db-crumb" id="home-sub"></p>
          <h1 class="db-title" id="home-title">home</h1>
        </div>
      </header>
      <div id="home-body"></div>
    </section>

    <!-- a table of records: members, applications, every module, accounts -->
    <section id="list" data-view hidden>
      <header class="db-head">
        <div>
          <p class="db-crumb" data-area>records</p>
          <h1 class="db-title" id="list-title"></h1>
        </div>
        <div class="db-actions" id="list-actions"></div>
      </header>
      <div class="db-panel">
        <div class="db-toolbar" id="filters"></div>
        <div class="db-scroll">
          <table class="db-table">
            <thead id="thead"></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <p class="db-empty" id="empty" hidden></p>
        <footer class="db-foot"><span id="count"></span><span id="count-note"></span></footer>
      </div>
    </section>

    <!-- the org chart -->
    <section id="org" data-view hidden>
      <header class="db-head">
        <div>
          <p class="db-crumb" data-area>records</p>
          <h1 class="db-title">members</h1>
        </div>
        <div class="db-actions" id="org-actions"></div>
      </header>
      <div class="db-panel">
        <div class="db-toolbar org-legend" id="org-legend"></div>
        <div class="db-scroll"><div class="org" id="org-chart"></div></div>
        <footer class="db-foot"><span id="org-count"></span><span id="org-note"></span></footer>
      </div>
      <div class="db-panel" id="org-unplaced" hidden>
        <div class="db-panel__head"><h2>not on the chart</h2><span class="db-note" id="org-unplaced-note"></span></div>
        <div class="db-panel__body"><div class="org-chips" id="org-unplaced-list"></div></div>
      </div>
    </section>

    <!-- one record -->
    <article id="detail" data-view hidden>
      <header class="db-head">
        <div>
          <p class="db-crumb"><a id="back" href="#/"></a> / <span class="mono" id="crumb-id"></span></p>
          <h1 class="db-title" id="detail-title"></h1>
          <div class="db-sub" id="detail-sub"></div>
        </div>
      </header>
      <div id="detail-body"></div>
    </article>

    <!-- what's on: IPs and events -->
    <section id="whats-on" data-view hidden>
      <header class="db-head">
        <div>
          <p class="db-crumb" data-area>records</p>
          <h1 class="db-title">what's on</h1>
        </div>
        <div class="db-actions"><a class="db-btn" href="/events.html" target="_blank" rel="noopener">view public page ↗</a></div>
      </header>
      <div class="db-panel">
        <div class="db-panel__head"><h2>our IPs</h2><a class="db-btn db-btn--sm" href="#/w/ip/new">+ add IP</a></div>
        <div class="db-scroll"><table class="db-table"><thead id="ip-head"></thead><tbody id="ip-rows"></tbody></table></div>
      </div>
      <div class="db-panel">
        <div class="db-panel__head"><h2>events</h2><a class="db-btn db-btn--sm" href="#/w/event/new">+ add event</a></div>
        <div class="db-scroll"><table class="db-table"><thead id="event-head"></thead><tbody id="event-rows"></tbody></table></div>
      </div>
    </section>

  </main>
</div>

<p class="db-toast" id="toast" role="status" aria-live="polite"></p>
<script src="/admin/teammap.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
