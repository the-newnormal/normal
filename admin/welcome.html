<!doctype html>
<html lang="en-SG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Set up your login · Normal admin</title>
  <meta name="theme-color" content="#faf9f7">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<main class="db-gate">
  <div class="db-card" id="w-form-card">
    <span class="db-brand"><img src="/assets/wordmark.svg" alt="Normal" width="1538" height="369"><span>admin</span></span>

    <form id="w-form" novalidate hidden>
      <h1>Welcome, <span id="w-name"></span></h1>
      <p>Your username is <strong class="mono" id="w-username"></strong>. Choose a password to finish setting up your login.</p>
      <input type="text" id="w-user" autocomplete="username" hidden>
      <div class="db-field">
        <label class="db-label" for="w-pass">Password <small>10 characters or more</small></label>
        <input class="db-input" type="password" id="w-pass" autocomplete="new-password" minlength="10" required>
      </div>
      <div class="db-field">
        <label class="db-label" for="w-pass2">Confirm password</label>
        <input class="db-input" type="password" id="w-pass2" autocomplete="new-password" required>
      </div>
      <p class="db-error" id="w-error" role="alert"></p>
      <button class="db-btn db-btn--primary" type="submit" id="w-go">Set password and sign in</button>
    </form>

    <div id="w-dead" hidden>
      <h1>This link doesn't work</h1>
      <p>Setup links work once and last 7 days. Ask a Master Admin for a new one.</p>
      <a class="db-btn" href="/">Go to sign in</a>
    </div>
  </div>
</main>

<script src="/admin/welcome.js"></script>
</body>
</html>
